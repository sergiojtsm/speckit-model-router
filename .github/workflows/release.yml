name: Release

# Publishes to npm with provenance whenever a version tag (v*) is pushed.
#   git tag v0.1.0 && git push origin v0.1.0
#
# Requires repository secret NPM_TOKEN (an npm Automation token).
# id-token: write enables npm provenance (SLSA) — proves the package was built
# from this repo by this workflow.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - run: npm ci

      # prepublishOnly runs typecheck + test + build before the package is created.
      - name: Publish to npm (with provenance)
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
